# Minimal, non-noisy golangci-lint config for the CloudWatch Plugin for OpenTelemetry (Go).
# Keeps golangci-lint's standard linter set (errcheck, govet, ineffassign, staticcheck, unused)
# and checks formatting with gofmt. Deliberately does NOT enable strict/opinionated linters
# (e.g. exhaustruct, wsl) that would generate noise without catching real defects.
version: "2"

run:
  timeout: 5m

linters:
  default: standard

formatters:
  enable:
    - gofmt

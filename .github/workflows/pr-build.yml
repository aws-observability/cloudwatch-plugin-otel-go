name: CloudWatch Plugin for OpenTelemetry PR Build

# Per-PR build for the standalone cloudwatch-plugin-otel-go module. Mirrors the Java plugin's
# PR-build layout (format/lint check, unit tests, OTel compat matrix) adapted to Go. This repo
# is a single standalone module, so unlike the Java monorepo there is no path filter.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main
      - "release/v*"
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Format and lint (gofmt, go vet, golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Check formatting (gofmt)
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          version: v1.61

  unit-tests:
    name: Unit and contract tests (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.21", "stable"] # minimum supported version and the latest release
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

  # Single required status check: gate on lint + unit-tests across the whole matrix.
  pr-checks-pass:
    name: All PR checks pass
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - run: echo "All PR checks passed."
